# Release: läuft ausschließlich für Tags der Form v<Ziffer>. Einen Tag zu pushen ist damit die einzige
# Aktion, die ein Release erzeugt.
#
# Voraussetzung: Repository-Secrets ANDROID_KEYSTORE_B64 (base64 -w0 pacor-release.jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Fest auf die Kombination gepinnt, gegen die auch lokal gebaut wird: JDK 17, build-tools
      # 34.0.0, Plattform android-34.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      # Der Keystore ist binär und liegt deshalb base64-kodiert im Secret; storeFile wird relativ zur
      # Properties-Datei aufgelöst, siehe app/build.gradle.
      - name: Signaturmaterial
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/pacor-release.jks"
          printf 'storeFile=pacor-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing/keystore.properties"

      - name: Tests und Build
        run: ./gradlew testDebugUnitTest assembleRelease -Ppacor.signing="$RUNNER_TEMP/signing/keystore.properties"

      - name: APK prüfen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="Pacor-${VERSION}.apk"
          # Ohne Schlüssel entstünde nur app-release-unsigned.apk, dann bricht schon das mv ab.
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          # Unsigniert durchrutschen wäre der schlimmste Fall: das APK ließe sich verteilen, aber nie
          # aktualisieren. Deshalb hart prüfen statt nur bauen.
          apksigner verify --print-certs "$APK"
          APK_VERSION=$(aapt2 dump badging "$APK" | grep -o "versionName='[^']*'" | cut -d"'" -f2)
          # Der Tag muss zu versionName passen, sonst zeigt der About-Dialog etwas anderes an als der
          # Download heißt.
          if [ "$APK_VERSION" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu versionName $APK_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Die Änderungen stehen im Text des annotierten Tags, die Installationshinweise sind immer gleich.
          git fetch --force --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo
            echo '**Installation:** `Pacor-'"$VERSION"'.apk` herunterladen und auf dem Handy öffnen. Android'
            echo 'fragt einmalig nach der Erlaubnis, Apps aus dieser Quelle zu installieren; Play Protect'
            echo 'warnt bei selbst signierten Apps, das lässt sich bestätigen. Voraussetzung ist Android 8'
            echo 'oder neuer. Ein neueres APK lässt sich einfach über die installierte Version installieren.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "Pacor-${VERSION}.apk" \
            --title "Pacor $VERSION" --notes-file notes.md

      - name: Aufräumen
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
